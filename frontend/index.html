<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Perplexity Clone</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; background: #f7f7f8; }
  h1 { font-size: 24px; }
  select, input, button { font-size: 16px; padding: 8px; margin: 5px 0; }
  input { width: 70%; }
  button { cursor: pointer; background: #10a37f; color: white; border: none; border-radius: 6px; padding: 8px 16px; }
  #answer { background: white; padding: 20px; border-radius: 8px; margin-top: 20px; white-space: pre-wrap; min-height: 50px; }
  #sources { font-size: 13px; color: #555; margin-top: 10px; }
  .loading { color: #999; font-style: italic; }
</style>
</head>
<body>

<h1>🔍 Perplexity Clone</h1>

<select id="focusMode">
  <option value="webSearch">Web Search</option>
  <option value="academicSearch">Academic Search</option>
  <option value="redditSearch">Reddit Search</option>
  <option value="youtubeSearch">YouTube Search</option>
  <option value="writingAssistant">Writing Assistant</option>
</select>
<br>
<input type="text" id="query" placeholder="Ask something...">
<button onclick="doSearch()">Search</button>

<div id="answer"></div>
<div id="sources"></div>

<script>
const BACKEND_URL = "https://perplexity-clone-assignment.onrender.com";

async function doSearch() {
  const query = document.getElementById("query").value;
  const focusMode = document.getElementById("focusMode").value;
  const answerDiv = document.getElementById("answer");
  const sourcesDiv = document.getElementById("sources");

  answerDiv.textContent = "";
  sourcesDiv.textContent = "";
  answerDiv.innerHTML = '<span class="loading">Thinking... (first request may take up to 50 seconds)</span>';

  const response = await fetch(`${BACKEND_URL}/api/search`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ focusMode, query, history: [] })
  });

  answerDiv.textContent = "";

  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });

    const parts = buffer.split("\n\n");
    buffer = parts.pop();

    for (const part of parts) {
      if (!part.startsWith("data:")) continue;
      const jsonStr = part.replace("data:", "").trim();
      if (!jsonStr || jsonStr === "{}") continue;

      try {
        const parsed = JSON.parse(jsonStr);
        if (parsed.type === "sources") {
          sourcesDiv.textContent = `Found ${parsed.data.length} sources`;
        }
        if (parsed.type === "response") {
          answerDiv.textContent += parsed.data;
        }
      } catch (e) {}
    }
  }
}
</script>

</body>
</html>
